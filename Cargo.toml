[package]
name = "marky"
version = "0.9.0"
edition = "2021"
description = "Markdown Magician 🧙"
license = "MIT"
repository = "https://github.com/metafates/marky"
authors = ["metafates"]
categories = ["command-line-utilities", "parsing", "visualization"]
keywords = ["markdown", "html", "cli", "image"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["cargo", "derive", "env"] }
clap_complete = "4.6.11"
colored = "3.1.1"
dirs = "7.0.0"
humansize = "2.1.3"
include_dir = "0.7.4"
levenshtein = "1.0.5"
markdown = "1.0.0"
notify = "8.2.1"
open = "5.4.5"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
tokio = { version = "1.54.1", features = [
  "rt-multi-thread",
  "macros",
  "io-util",
] }
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "tokio",
  "ws",
] }
handlebars = "6.4.4"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
minify-js = "0.6.0"
minifier = "0.4.0"
lol_html = "3.0.3"
base64 = "0.23.1"
percent-encoding = "2.3.2"
image = "0.25.10"
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "rustls",
] }
oxipng = "10.2.1"
